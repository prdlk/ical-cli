version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      # Output writers are checked where it matters; a failed write to a closed
      # stdout cannot be recovered from usefully.
      exclude-functions:
        - (io.Writer).Write
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Table-driven tests intentionally repeat structure and use long literals.
      - path: _test\.go
        linters:
          - dupl
          - gocritic
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
